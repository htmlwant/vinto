<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" type="image/x-icon" href="/image/logo_image.png">
    <title>빈투 - 회원가입</title>
    <link rel="stylesheet" href="/css/register.css">
</head>
<body>
    <div class="register_container">
        <div class="register_box">
            <div class="register_title">
                <h1>VINTU</h1>
                <h2>회원가입</h2>
                <p>빈투에서 새로운 음악을 만나보세요.</p>
            </div>
            <form id="registerForm">
                <div class="input_group">
                    <label for="user_id">아이디</label>
                    <div class="id_check_box">
                        <input type="text" id="user_id" placeholder="아이디를 입력하세요" autocomplete="username" required>
                        <button type="button" id="idCheckButton" class="id_check_button">중복확인</button>
                    </div>
                    <p id="idCheckMessage" class="check_message"></p>
                </div>
                <div class="input_group">
                    <label for="user_password">비밀번호</label>
                    <input type="password" id="user_password" placeholder="특수문자 1개를 조합한 8자 이상" autocomplete="new-password" required>
                    <div class="password_check">
                                <p id="lengthCheck">✕ 8자 이상</p>
                                <p id="specialCheck">✕ 특수문자 1개 이상</p>
                    </div>
                </div>
                <div class="input_group">
                    <label for="phone">전화번호</label>
                    <input type="text" id="phone" placeholder="010-1234-5678" required>
                </div>
                <div class="input_group">
                    <label for="nickname">닉네임</label>
                    <input type="text" id="nickname" placeholder="닉네임을 입력하세요" required>
                </div>
                <div class="input_group">
                    <label for="name">이름</label>
                    <input type="text" id="name" placeholder="이름을 입력하세요" required>
                </div>
                <div id="message" class="message"></div>
                <button type="submit" class="register_button">회원가입</button>
            </form>
            <div class="login_link">
                <span>이미 회원이신가요?</span>
                <a href="login.html">로그인</a>
            </div>
        </div>
    </div>
    <script src="js/register.js"></script>
</body>
</html>
